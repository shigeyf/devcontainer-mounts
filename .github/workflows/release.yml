name: Release Dev Container Feature

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test and package the Feature
        run: bash tests/test.sh

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' src/mounts/devcontainer-feature.json)"
          tag="v$version"
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$tag" <<< "$releases"; then
            echo "::error::Release $tag already exists. Bump the Feature version."
            exit 1
          fi
          gh api "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          gh release create "$tag" \
            dist/devcontainer-feature-mounts.tgz \
            dist/devcontainer-feature-mounts.tgz.sha256 \
            --verify-tag --draft --title "$tag" --generate-notes
          gh release edit "$tag" --draft=false
